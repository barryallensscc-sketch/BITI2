<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BITI Admin — Content Management</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="../CSS/admin.css">
<link rel="icon" href="../IMAGES/BITI logo.png">
</head>
<body>

<!-- ═══════════ LOGIN SCREEN ═══════════ -->
<div id="login-screen">
<div class="login-card">
<img src="../IMAGES/BITI logo.png" alt="BITI">
<h1>Admin Panel</h1>
<p class="subtitle">Sign in to manage your content</p>
<div class="form-group">
<label for="login-user">Username</label>
<input id="login-user" placeholder="Enter username" autocomplete="username">
</div>
<div class="form-group">
<label for="login-pass">Password</label>
<input id="login-pass" type="password" placeholder="Enter password" autocomplete="current-password">
</div>
<button class="btn btn-primary" id="login-btn">Sign In →</button>
<p class="login-error" id="login-error"></p>
</div>
</div>

<!-- ═══════════ APP SHELL ═══════════ -->
<div id="app" class="app" style="display:none">

<!-- Mobile Sidebar Toggle -->
<button class="mobile-toggle" id="mobile-toggle">☰</button>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
<div class="sidebar-brand">
<img src="../IMAGES/BITI logo.png" alt="BITI">
<div><span>BITI CMS</span><small>Content Manager</small></div>
</div>

<nav>
<div class="nav-label">Main</div>
<a data-section="dashboard" class="active"><span class="icon">📊</span> Dashboard</a>

<div class="nav-label">Content</div>
<a data-section="courses"><span class="icon">📚</span> Courses</a>
<a data-section="events"><span class="icon">📅</span> Events</a>
<a data-section="posts"><span class="icon">📝</span> Blog Posts</a>
<a data-section="team"><span class="icon">👥</span> Team</a>
<a data-section="stories"><span class="icon">💬</span> Stories</a>
<a data-section="jobs"><span class="icon">💼</span> Jobs</a>

<div class="nav-label">System</div>
<a data-section="submissions"><span class="icon">📩</span> Submissions <span class="badge" id="sub-badge" style="display:none">0</span></a>
<a data-section="settings"><span class="icon">⚙️</span> Settings</a>
</nav>

<div class="sidebar-footer">
<button class="btn-logout" id="logout-btn">↪ Sign Out</button>
</div>
</aside>

<!-- Main Content Area -->
<main class="main">
<div class="page-header" id="page-header">
<div>
<h1 id="page-title">Dashboard</h1>
<p id="page-subtitle">Overview of your content</p>
</div>
<div class="actions" id="header-actions"></div>
</div>
<div class="content-area" id="content-area">
<!-- Dynamic content rendered by admin.js -->
</div>
</main>

</div>

<!-- ═══════════ MODAL ═══════════ -->
<div id="modal" class="modal-overlay" style="display:none">
<div class="modal-card">
<div class="modal-header">
<h2 id="modal-title">Add Item</h2>
<button class="modal-close" id="modal-close">&times;</button>
</div>
<div class="modal-body" id="modal-body"></div>
<div class="modal-footer">
<button class="btn btn-secondary" id="modal-cancel">Cancel</button>
<button class="btn btn-primary" id="modal-save">Save</button>
</div>
</div>
</div>

<script src="admin.js"></script>
</body>
</html>
